<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c1e44">
    <title>Avaliação — GoatWork</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c1e44'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-weight='700' font-size='18' fill='%23fe893c'%3EG%3C/text%3E%3C/svg%3E">
    <script src="../js/utils/tema-inicial.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base/variables.css">
    <link rel="stylesheet" href="../css/base/reset.css">
    <link rel="stylesheet" href="../css/base/typography.css">
    <link rel="stylesheet" href="../css/components/navbar.css">
    <link rel="stylesheet" href="../css/components/footer.css">
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/forms.css">
    <link rel="stylesheet" href="../css/components/cards.css">
    <link rel="stylesheet" href="../css/pages/avaliacao.css">
</head>
<body>
    <div id="navbar"></div>
    <main class="page">
        <div class="container">
            <header class="np-head">
                <p class="page-eyebrow" id="numero">Contrato</p>
                <h1 class="page-title" id="titulo">Avalie o serviço</h1>
                <p class="page-subtitle" id="subtitulo">Sua avaliação ajuda outros clientes e constrói a reputação do profissional.</p>
            </header>

            <div class="layout-side pg-layout">
                <section class="card en-card" id="principal">
                    <div class="loading">Carregando…</div>
                </section>

                <aside class="side-stack">
                    <section class="card-soft av-resumo">
                        <h3>Resumo do contrato</h3>
                        <p id="resumo">—</p>
                        <dl>
                            <div><dt>Valor</dt><dd id="valor">—</dd></div>
                            <div><dt>Pagamento</dt><dd id="pagamento">—</dd></div>
                            <div><dt>Concluído em</dt><dd id="concluido">—</dd></div>
                        </dl>
                    </section>
                    <div class="card-outline" id="nota-lateral">Cada pessoa avalia a outra parte uma única vez por contrato concluído. O profissional também avalia você.</div>
                </aside>
            </div>
        </div>
    </main>
    <div id="footer"></div>
    <script type="module" src="../js/pages/avaliacao.js"></script>
</body>
</html>
