<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c1e44">
    <title>Encontre profissionais — GoatWork</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c1e44'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-weight='700' font-size='18' fill='%23fe893c'%3EG%3C/text%3E%3C/svg%3E">
    <script src="../js/utils/tema-inicial.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base/variables.css">
    <link rel="stylesheet" href="../css/base/reset.css">
    <link rel="stylesheet" href="../css/base/typography.css">
    <link rel="stylesheet" href="../css/components/navbar.css">
    <link rel="stylesheet" href="../css/components/footer.css">
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/forms.css">
    <link rel="stylesheet" href="../css/components/cards.css">
    <link rel="stylesheet" href="../css/pages/profissionais.css">
</head>
<body>
    <div id="navbar"></div>
    <main class="page">
        <div class="container">
            <h1 class="page-title">Encontre profissionais</h1>

            <form class="busca" id="form-busca" role="search">
                <label class="sr-only" for="busca">Buscar por nome ou serviço</label>
                <input class="input" id="busca" type="search" placeholder="Buscar por nome ou serviço..." autocomplete="off">
            </form>

            <div class="chips" id="categorias" role="group" aria-label="Filtrar por categoria">
                <button class="chip" type="button" data-id="" aria-pressed="true">Todos</button>
            </div>

            <div class="prof-grid" id="lista" aria-live="polite">
                <div class="loading">Carregando profissionais…</div>
            </div>
        </div>
    </main>
    <div id="footer"></div>
    <script type="module" src="../js/pages/profissionais.js"></script>
</body>
</html>
