<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c1e44">
    <title>Criar conta — GoatWork</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c1e44'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-weight='700' font-size='18' fill='%23fe893c'%3EG%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base/variables.css">
    <link rel="stylesheet" href="../css/base/reset.css">
    <link rel="stylesheet" href="../css/base/typography.css">
    <link rel="stylesheet" href="../css/components/navbar.css">
    <link rel="stylesheet" href="../css/components/footer.css">
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/forms.css">
    <link rel="stylesheet" href="../css/components/cards.css">
    <link rel="stylesheet" href="../css/pages/cadastro.css">
</head>
<body>
    <div id="navbar"></div>
    <main class="auth-page">
        <div class="auth-grid auth-grid--cadastro">
            <section class="card card--shadow auth-card">
                <h1 class="auth-title">Criar conta na GoatWork</h1>

                <div class="segmented" role="group" aria-label="Tipo de conta" id="tipo-conta">
                    <button type="button" data-tipo="CLIENTE" aria-pressed="true">Sou Cliente</button>
                    <button type="button" data-tipo="TRABALHADOR" aria-pressed="false">Sou Trabalhador</button>
                </div>

                <form id="form-cadastro" novalidate>
                    <p class="form-error" id="erro" hidden></p>

                    <div class="field">
                        <label class="label" for="nome">Nome completo</label>
                        <input class="input" id="nome" type="text" placeholder="Seu nome" autocomplete="name" required>
                    </div>

                    <div class="field">
                        <label class="label" for="email">E-mail</label>
                        <input class="input" id="email" type="email" placeholder="voce@email.com" autocomplete="email" required>
                    </div>

                    <div class="field field-row">
                        <div>
                            <label class="label" for="cpf">CPF</label>
                            <input class="input" id="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00" required>
                        </div>
                        <div>
                            <label class="label" for="telefone">Telefone <small>(opcional)</small></label>
                            <input class="input" id="telefone" type="tel" inputmode="numeric" placeholder="(11) 90000-0000" autocomplete="tel">
                        </div>
                    </div>

                    <!-- Cliente -->
                    <div class="field field-row" data-somente="CLIENTE">
                        <div>
                            <span class="label">Tipo de pessoa</span>
                            <div class="segmented" role="group" aria-label="Tipo de pessoa" id="tipo-pessoa">
                                <button type="button" data-valor="FISICA" aria-pressed="true">Física</button>
                                <button type="button" data-valor="JURIDICA" aria-pressed="false">Jurídica</button>
                            </div>
                        </div>
                        <div>
                            <label class="label" for="nome-exibicao">Nome de exibição <small>(opcional)</small></label>
                            <input class="input" id="nome-exibicao" type="text" placeholder="Como quer aparecer">
                        </div>
                    </div>

                    <!-- Trabalhador -->
                    <div class="field field-row" data-somente="TRABALHADOR" hidden>
                        <div>
                            <label class="label" for="profissao">Profissão</label>
                            <input class="input" id="profissao" type="text" placeholder="Ex.: Eletricista">
                        </div>
                        <div>
                            <label class="label" for="cidade">Cidade</label>
                            <input class="input" id="cidade" type="text" placeholder="Ex.: São Paulo, SP ou Remoto">
                        </div>
                    </div>

                    <div class="field field-row">
                        <div>
                            <label class="label" for="senha">Senha</label>
                            <input class="input" id="senha" type="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required>
                        </div>
                        <div>
                            <label class="label" for="confirmar">Confirmar senha</label>
                            <input class="input" id="confirmar" type="password" placeholder="Repita a senha" autocomplete="new-password" required>
                        </div>
                    </div>

                    <label class="check auth-check">
                        <input type="checkbox" id="aceite">
                        <span>Li e aceito os <a class="link-termos" href="termos.html" target="_blank">termos de uso</a> e a isenção de responsabilidade da GoatWork.</span>
                    </label>

                    <button class="btn btn-primary btn-block auth-submit" id="btn-cadastrar" type="submit" disabled>Criar conta de cliente</button>
                </form>

                <p class="auth-alt">Já tem conta? <a class="link" id="link-entrar" href="entrar.html">Entrar</a></p>
            </section>

            <aside class="termos-painel" id="termos-painel" aria-label="Termos de uso"></aside>
        </div>
    </main>
    <div id="footer"></div>
    <script type="module" src="../js/pages/cadastro.js"></script>
</body>
</html>
